<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <!-- Central core: hexagon hub -->
  <g filter="url(#glow)">
    <polygon points="256,96 396,176 396,336 256,416 116,336 116,176" fill="none" stroke="url(#brain)" stroke-width="18" stroke-linejoin="round"/>
    <polygon points="256,96 396,176 396,336 256,416 116,336 116,176" fill="url(#brain)" fill-opacity="0.12"/>
  </g>

  <!-- Brain node: circuit + spark -->
  <g>
    <circle cx="256" cy="256" r="52" fill="#0f172a" stroke="url(#brain)" stroke-width="10"/>
    <path d="M236 244 q10 -18 20 0 q10 18 20 0 M240 268 q8 -12 16 0 q8 12 16 0" fill="none" stroke="url(#brain)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Hand node: top -->
  <g>
    <circle cx="256" cy="140" r="34" fill="#0f172a" stroke="url(#hand)" stroke-width="9"/>
    <path d="M256 130 v20 M246 140 h20" stroke="url(#hand)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Vault node: bottom-left -->
  <g>
    <circle cx="168" cy="360" r="34" fill="#0f172a" stroke="url(#vault)" stroke-width="9"/>
    <rect x="156" y="352" width="24" height="16" rx="3" fill="none" stroke="url(#vault)" stroke-width="5"/>
  </g>

  <!-- Council node: bottom-right -->
  <g>
    <circle cx="344" cy="360" r="34" fill="#0f172a" stroke="url(#hand)" stroke-width="9"/>
    <circle cx="344" cy="356" r="10" fill="none" stroke="url(#hand)" stroke-width="5"/>
    <path d="M334 372 q10 8 20 0" fill="none" stroke="url(#hand)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Connection lines -->
  <line x1="256" y1="174" x2="256" y2="204" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="240" y1="228" x2="196" y2="326" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="272" y1="228" x2="316" y2="326" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Subtle dots on connections -->
  <circle cx="256" cy="190" r="5" fill="#38bdf8"/>
  <circle cx="218" cy="278" r="5" fill="#34d399"/>
  <circle cx="294" cy="278" r="5" fill="#a78bfa"/>
</svg>
