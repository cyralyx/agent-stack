name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bash syntax check
        run: |
          bash -n bin/stack
          bash -n setup.sh
          bash -n bridges/hermes-to-openclaw
          bash -n bridges/hermes-worker
          bash -n bridges/vault-note
          bash -n hooks/openclaw-wife-reviewer
      - name: Python syntax check
        run: |
          python -m py_compile council/council_v2.py
      - name: Validate council runs (no network, offline smoke)
        run: |
          python -c "import council_v2; print('council_v2 imports OK')" || true
